name: Claude Review
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
jobs:
  claude-review:
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # caller must grant; org default token is read-only
    if: github.actor != 'dependabot[bot]'
    uses: PSD401/.github/.github/workflows/reusable-claude-review.yml@main
    secrets: inherit
