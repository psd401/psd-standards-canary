# Calls the org reusable that turns on auto-merge for Dependabot PRs whose every
# update is a patch to a development dependency (standards/04-security.md rule 4).
# Pinned to the PSD401/.github#78 branch commit for the pre-release canary run.
name: Dependabot auto-merge
"on": pull_request
permissions: {}
jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: PSD401/.github/.github/workflows/reusable-dependabot-auto-merge.yml@3eeea0fd824097793fe641f3e77fa9f4c279eb3d # pre-release
    with:
      merge_method: squash
